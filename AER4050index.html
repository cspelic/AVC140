<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVCAER4050FC — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F0E7;--paper-alt:#ECE6D6;--card:#FFFFFF;--ink:#23201A;--ink-soft:#5B564A;--accent:#145A4A;--accent-dark:#0E463A;--accent-tab:#8B3A2F;--rule:#D9D2C1;--focus:#0E463A;--radius:10px;font-size:16px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;min-height:100vh;}
h1{font-family:'Public Sans',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0 0 .3em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.02em;}
.skip-link{position:absolute;left:-999px;top:0;background:var(--accent-dark);color:#fff;padding:.75em 1.25em;z-index:100;border-radius:0 0 8px 0;font-weight:600;}
.skip-link:focus{left:0;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
header.top{border-bottom:2px solid var(--ink);padding:1.75rem 1.5rem 1.25rem;max-width:700px;margin:0 auto;}
header.top .eyebrow{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);background:var(--paper-alt);border:1px solid var(--rule);padding:.2em .6em;border-radius:4px;margin-bottom:.6rem;}
main{max-width:700px;margin:0 auto;padding:1.5rem;}
.deck-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;}
.stage{perspective:1400px;max-width:560px;margin:0 auto 1.25rem;}
.card-face{position:relative;width:100%;min-height:260px;border-radius:var(--radius);background:transparent;border:none;padding:0;cursor:pointer;display:block;}
.card-inner{display:block;position:relative;width:100%;height:100%;min-height:260px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.card-face[aria-pressed="true"] .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--radius);box-shadow:0 2px 0 var(--rule),0 10px 24px -12px rgba(35,32,26,.35);padding:2rem 1.75rem;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.face::before{content:"";position:absolute;left:1.75rem;right:1.75rem;top:3.2rem;height:2px;background:repeating-linear-gradient(to right,var(--rule) 0 10px,transparent 10px 16px);}
.face .tag{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--accent-tab);padding:.25em .6em;border-radius:3px 3px 3px 0;}
.face-badges{display:flex;align-items:center;gap:.5rem;align-self:flex-start;margin-bottom:1.4rem;}
.verified-stamp-wrap{position:absolute;right:1.1rem;bottom:1.1rem;transform:rotate(-9deg);pointer-events:none;}
.verified-stamp-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--accent);color:var(--accent);opacity:.88;}
.verified-stamp-ring svg{flex:none;}
.verified-stamp-text{font-family:'Public Sans',sans-serif;font-weight:800;font-size:.5rem;line-height:1.2;letter-spacing:.06em;text-align:center;text-transform:uppercase;}
.face.back .tag{background:var(--accent-dark);}
.face .content{font-family:'Public Sans',system-ui,sans-serif;font-weight:500;font-size:1.3rem;line-height:1.45;flex:1;display:flex;align-items:center;overflow-wrap:anywhere;}
.face .idx{position:absolute;top:.9rem;right:1rem;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-soft);}
.face.back{transform:rotateY(180deg);}
.controls{display:flex;justify-content:center;align-items:center;gap:.6rem;flex-wrap:wrap;}
.btn{font-family:'Public Sans',sans-serif;font-weight:600;font-size:.95rem;border-radius:8px;border:1.5px solid var(--accent-dark);background:var(--accent);color:#fff;padding:.7em 1.3em;min-height:44px;cursor:pointer;}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:var(--card);color:var(--accent-dark);}
.btn.secondary:hover{background:var(--paper-alt);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.hint{color:var(--ink-soft);font-size:.9rem;text-align:center;}
#sr-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (prefers-reduced-motion: reduce){.card-inner{transition:none;}}
@media (max-width:500px){.face .content{font-size:1.2rem;}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="top">
<span class="eyebrow">Catalog Drawer</span>
<h1>AVCAER4050FC</h1>
</header>
<main id="main">
<div class="deck-meta"><span class="mono" id="progress"></span></div>
<div class="stage">
<button type="button" class="card-face" id="card-btn" aria-pressed="false">
<span class="card-inner" id="card-inner">
<span class="face front"><span class="idx mono" id="idx-front"></span><span class="face-badges"><span class="tag">Question</span></span><span class="content" id="front-text"></span></span>
<span class="face back" aria-hidden="true"><span class="idx mono" id="idx-back"></span><span class="face-badges"><span class="tag">Answer</span></span><span class="content" id="back-text"></span><span class="verified-stamp-wrap" aria-hidden="true"><span class="verified-stamp-ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="verified-stamp-text">Verified<br>Correct</span></span></span></span>
</span>
</button>
</div>
<div class="controls">
<button type="button" class="btn secondary" id="prev-btn">← Previous</button>
<button type="button" class="btn" id="flip-btn">Flip card</button>
<button type="button" class="btn secondary" id="next-btn">Next →</button>
<button type="button" class="btn secondary" id="shuffle-btn">Shuffle</button>
</div>
<p class="hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> on the focused card to flip it, and use the ←/→ arrow keys to move between cards.</p>
<div id="sr-status" aria-live="polite"></div>
</main>
<script>
(function(){
"use strict";
var cards = [{"front":"What is the primary purpose of electrical bonding and grounding in aircraft manufacturing?","back":"It ensures electrical energy flows according to engineering specifications to prevent hazards like fire or interference."},{"front":"Electrically connecting two or more metal objects to create a common electrical potential is known as _____.","back":"Bonding"},{"front":"What is the definition of 'grounding' in the context of aircraft electrical systems?","back":"Connecting a conductor to the aircraft structure to serve as a common return path for electrical current."},{"front":"Which unit is used to measure electrical current, and what does it represent?","back":"Current is measured in amperes ($A$) and represents the flow of electrical charge through a conductor."},{"front":"Describe a 'cleaned surface' as defined for bonding operations.","back":"A surface mechanically abraded and chemically cleaned to expose bare, conductive metal by removing paint, oxides, and contaminants."},{"front":"What is the 'finished surface' in a ground stud installation area?","back":"The area surrounding the bond point that retains its protective coating, such as paint, primer, or anodize."},{"front":"Why is it mandatory to check the engineering drawing's revision level before starting an installation?","back":"Outdated drawings may specify incorrect stud sizes, hole diameters, or resistance limits."},{"front":"What specific requirements must be noted from the engineering documentation before beginning work?","back":"Stud size, hole diameter, edge margin, torque values, resistance limits, and special process notes."},{"front":"What tool is used to tighten the nut onto the ground stud to ensure it is neither under- nor over-torqued?","back":"A calibrated torque wrench or nutdriver."},{"front":"What is the function of a deburring tool in the drilling process?","back":"It removes sharp edges and raised metal (burrs) from both sides of a drilled hole."},{"front":"Which tool is attached to a drill to clean the bond area down to bare metal?","back":"A rotary abrasive brush (Scotch-Brite or wire brush attachment)."},{"front":"Why must an OHMmeter have a current calibration sticker before use?","back":"An uncalibrated meter may provide false readings, leading to the acceptance of an out-of-tolerance installation."},{"front":"What chemical is typically used for the chemical conversion coating of bare aluminum surfaces?","back":"Alodine (or an equivalent MIL-DTL-5541 approved coating)."},{"front":"What is the purpose of applying masking tape around the bond area during preparation?","back":"It protects the surrounding finished surface from being damaged by abrasive cleaning tools."},{"front":"In the hole layout process, what is the purpose of a center punch?","back":"It creates a small dimple to prevent the drill bit from walking when drilling begins."},{"front":"Define 'edge margin' (also known as edge distance).","back":"The distance from the center of a hole to the nearest edge of the structural member."},{"front":"What is the general rule for minimum edge margin in most aircraft structural applications?","back":"The minimum edge margin is $2 \\times$ the hole diameter ($2D$)."},{"front":"Calculate the minimum required edge margin for a hole with a diameter of $0.250\"$.","back":"The minimum edge margin is $0.500\"$ from the hole center to any edge."},{"front":"What is the primary function of a pilot hole?","back":"It establishes the exact location and guides larger drill bits during hole enlargement."},{"front":"What are the typical bit sizes used for drilling a pilot hole?","back":"$#30$ ($0.1285\"$) or $#40$ ($0.0980\"$)."},{"front":"At what angle must the drill be kept relative to the surface to ensure proper stud seating?","back":"The drill must be kept perpendicular ($90^{\\circ}$) to the surface."},{"front":"Why should drill chips (swarf) be cleared frequently during operation?","back":"Chip buildup causes heat that can damage the hole finish or break the drill bit."},{"front":"Why is 'step-drilling' preferred over jumping directly to the final drill size?","back":"It produces a rounder, smoother hole and prevents drill walk or chatter."},{"front":"What tool should be used to verify the finished hole diameter?","back":"A calibrated pin gauge or digital caliper."},{"front":"What defines an 'undersized hole' in aircraft assembly?","back":"A drilled diameter that is smaller than the minimum allowable dimension specified on the engineering drawing."},{"front":"If a hole is undersized but still within edge margin limits, what is the corrective action?","back":"Re-drill the hole using the correct final-size bit."},{"front":"Why must you never force a ground stud into an undersized hole?","back":"It damages threads, distorts the structure, and creates an unreliable electrical bond."},{"front":"Where does a 'burr' typically form during the drilling process?","back":"Around the hole edge on both the front (near side) and back (far side) faces of the material."},{"front":"How should the top face (near side) of a hole be deburred?","back":"By hand using a deburring tool or countersink bit, rotating lightly until the burr is flush."},{"front":"Why is abrasive cleaning with a rotary brush considered a critical step?","back":"It removes non-conductive coatings and oxides to expose the bare metal required for a low-resistance bond."},{"front":"How large should the cleaned metal area be relative to the ground stud?","back":"It should be only slightly larger than the stud base diameter."},{"front":"Why must bare aluminum be chemically treated immediately after abrasive cleaning?","back":"Aluminum oxidizes rapidly in air, which increases electrical resistance and degrades bond quality."},{"front":"What two benefits does chemical conversion coating provide to a bonding surface?","back":"It provides corrosion protection while maintaining electrical conductivity."},{"front":"What is the correct procedure for using Isopropyl Alcohol (IPA) during surface prep?","back":"Wipe the cleaned area with IPA on a clean cloth and allow it to dry completely without residue."},{"front":"True or False: Alodine 1201 brush-on type should be rinsed off before stud installation.","back":"False; it should not be rinsed."},{"front":"What is the role of the washer in a ground stud assembly?","back":"It distributes the clamping load and protects the aircraft structure from being damaged by the nut."},{"front":"What type of nut is typically used to prevent loosening due to vibration?","back":"A self-locking nut, such as an all-metal prevailing torque or nylock type."},{"front":"Why must you avoid touching the prepared bond area with bare hands?","back":"Skin oils contaminate the surface and increase electrical resistance."},{"front":"How should the locking nut be initially started onto the stud threads?","back":"By hand, to avoid cross-threading."},{"front":"During the torquing procedure, how is the stud head managed?","back":"It is held stationary using a back-up wrench or appropriate tool."},{"front":"What are the consequences of an under-torqued ground stud nut?","back":"The stud may spin or loosen, causing electrical resistance to increase over time."},{"front":"What is a 'torque stripe' (witness mark)?","back":"A painted mark across the nut and structure indicating that proper torque was applied and hasn't shifted."},{"front":"What does a high resistance reading indicate in a ground stud installation?","back":"It indicates contamination, poor surface prep, a loose nut, or improper hardware contact."},{"front":"What is the typical maximum allowable resistance for aircraft bonding connections?","back":"$0.1 \\Omega$ ($100$ milliohms)."},{"front":"In resistance measurement, what is 'lead compensation' or 'zeroing' the meter?","back":"Touching test leads together and using the 'REL' or 'Zero' function to subtract lead resistance for accuracy."},{"front":"Which resistance range should be selected on the OHMmeter for ground stud measurements?","back":"The lowest available range, typically the milliohm or $200$ $m\\Omega$ range."},{"front":"Where should the two probes be placed when measuring installation resistance?","back":"One probe on the ground stud (head or threads) and the second on the bare parent structure adjacent to the installation."},{"front":"If the measured resistance exceeds the limit on the first attempt, what is the required action?","back":"Remove the stud, re-clean the surface, reinstall, and re-measure."},{"front":"When should the refinishing of the bond area begin?","back":"Only after a passing resistance measurement has been recorded."},{"front":"Where should primer NOT be applied during the refinishing step?","back":"On the conductive bonding surfaces or threaded areas intended for ground connections."},{"front":"How should the edges of the new topcoat be finished relative to the existing aircraft finish?","back":"The edges should feather smoothly into the surrounding finish without visible ridges."},{"front":"What must be done to unused holes drilled during the installation process?","back":"They must be deburred, chemically treated, primed, and potentially sealed or topcoated to prevent corrosion."},{"front":"According to the summary flow, what is the very first step of the installation process?","back":"Reviewing engineering documentation (Review Docs)."},{"front":"List three visible characteristics of a properly completed ground stud installation.","back":"The stud is flush/square, the nut is seated with a witness mark, and the surrounding finish is restored."},{"front":"Who must provide an independent verification and sign-off for bonding and grounding installations?","back":"A Quality Inspector (QI)."},{"front":"What document is used to record employee IDs, dates, resistance values, and tool calibration data?","back":"The shop traveler (job card or work order)."},{"front":"What is the rule for correcting an error on a shop traveler?","back":"Draw a single line through the error, then initial and date the correction; never use correction fluid."},{"front":"Which safety protection is required at all times when drilling to prevent injury from metal chips?","back":"Eye protection (safety glasses or goggles)."},{"front":"Why is hand protection necessary when handling deburred aircraft structures?","back":"Burrs on freshly cut aluminum are razor-sharp and can cause severe cuts."},{"front":"Where can a technician find safety information for chemicals like IPA or Alodine?","back":"In the Safety Data Sheet (SDS)."},{"front":"What is the typical resistance limit for a static bond strap?","back":"$\\le 1.0 \\Omega$."},{"front":"MIL-DTL-5541 is the specification for what type of treatment?","back":"Chemical conversion coatings on aluminum and aluminum alloys."},{"front":"Which military handbook provides guidance for aircraft electrical grounding and safety?","back":"MIL-HDBK-274A."},{"front":"Failure to meet resistance specifications can result in _____ of the assembly and required rework.","back":"Rejection"},{"front":"What is the 'datum reference' used for during layout?","back":"It is the starting point or reference point on the structure used to measure the exact X-Y coordinates for the hole."},{"front":"What is 'swarf'?","back":"Metal chips produced during the drilling or machining process."},{"front":"A _____ is used in Step 3 of enlarging a hole to bring it to the exact engineered diameter.","back":"Final drill or reamer"},{"front":"What does a 'holiday' refer to in the context of refinishing?","back":"A bare spot or gap in the protective coating."},{"front":"Pneumatic drills produce high noise levels; therefore, _____ must be worn in enclosed spaces like aircraft bays.","back":"Hearing protection (ear plugs or ear muffs)"},{"front":"Why is the use of a back-up wrench necessary during torquing?","back":"To hold the stud head stationary and prevent it from rotating while the nut is tightened."}];
var order = cards.map(function(_, i){ return i; });
var current = 0;
var cardBtn = document.getElementById("card-btn");
var frontText = document.getElementById("front-text");
var backText = document.getElementById("back-text");
var idxFront = document.getElementById("idx-front");
var idxBack = document.getElementById("idx-back");
var progressEl = document.getElementById("progress");
var prevBtn = document.getElementById("prev-btn");
var nextBtn = document.getElementById("next-btn");
var flipBtn = document.getElementById("flip-btn");
var shuffleBtn = document.getElementById("shuffle-btn");
var srStatus = document.getElementById("sr-status");
function shuffleArray(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function renderCard(announce){
  var c = cards[order[current]];
  frontText.textContent = c.front;
  backText.textContent = c.back;
  idxFront.textContent = String(current + 1).padStart(3, "0");
  idxBack.textContent = String(current + 1).padStart(3, "0");
  cardBtn.setAttribute("aria-pressed", "false");
  cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
  progressEl.textContent = "Card " + (current + 1) + " of " + cards.length;
  if (announce) srStatus.textContent = "Card " + (current + 1) + " of " + cards.length + ". Question: " + c.front;
  prevBtn.disabled = cards.length <= 1;
  nextBtn.disabled = cards.length <= 1;
}
function flipCard(){
  var pressed = cardBtn.getAttribute("aria-pressed") === "true";
  var c = cards[order[current]];
  if (pressed){
    cardBtn.setAttribute("aria-pressed", "false");
    cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
    srStatus.textContent = "Showing question: " + c.front;
  } else {
    cardBtn.setAttribute("aria-pressed", "true");
    cardBtn.setAttribute("aria-label", "Verified answer: " + c.back + ". Activate to show the question.");
    srStatus.textContent = "Showing verified answer: " + c.back;
  }
}
function goTo(delta){
  if (cards.length < 2) return;
  current = (current + delta + cards.length) % cards.length;
  renderCard(true);
}
cardBtn.addEventListener("click", flipCard);
flipBtn.addEventListener("click", function(){ cardBtn.focus(); flipCard(); });
prevBtn.addEventListener("click", function(){ goTo(-1); });
nextBtn.addEventListener("click", function(){ goTo(1); });
shuffleBtn.addEventListener("click", function(){ order = shuffleArray(order); current = 0; renderCard(false); srStatus.textContent = "Deck shuffled. Card 1 of " + cards.length; });
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft"){ e.preventDefault(); goTo(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); goTo(1); }
});
if (cards.length){ renderCard(true); } else { progressEl.textContent = "No cards found."; }
})();
</script>
</body>
</html>
