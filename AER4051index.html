<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVCAER4051FC — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F0E7;--paper-alt:#ECE6D6;--card:#FFFFFF;--ink:#23201A;--ink-soft:#5B564A;--accent:#145A4A;--accent-dark:#0E463A;--accent-tab:#8B3A2F;--rule:#D9D2C1;--focus:#0E463A;--radius:10px;font-size:16px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;min-height:100vh;}
h1{font-family:'Public Sans',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0 0 .3em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.02em;}
.skip-link{position:absolute;left:-999px;top:0;background:var(--accent-dark);color:#fff;padding:.75em 1.25em;z-index:100;border-radius:0 0 8px 0;font-weight:600;}
.skip-link:focus{left:0;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
header.top{border-bottom:2px solid var(--ink);padding:1.75rem 1.5rem 1.25rem;max-width:700px;margin:0 auto;}
header.top .eyebrow{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);background:var(--paper-alt);border:1px solid var(--rule);padding:.2em .6em;border-radius:4px;margin-bottom:.6rem;}
main{max-width:700px;margin:0 auto;padding:1.5rem;}
.deck-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;}
.stage{perspective:1400px;max-width:560px;margin:0 auto 1.25rem;}
.card-face{position:relative;width:100%;min-height:260px;border-radius:var(--radius);background:transparent;border:none;padding:0;cursor:pointer;display:block;}
.card-inner{display:block;position:relative;width:100%;height:100%;min-height:260px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.card-face[aria-pressed="true"] .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--radius);box-shadow:0 2px 0 var(--rule),0 10px 24px -12px rgba(35,32,26,.35);padding:2rem 1.75rem;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.face::before{content:"";position:absolute;left:1.75rem;right:1.75rem;top:3.2rem;height:2px;background:repeating-linear-gradient(to right,var(--rule) 0 10px,transparent 10px 16px);}
.face .tag{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--accent-tab);padding:.25em .6em;border-radius:3px 3px 3px 0;}
.face-badges{display:flex;align-items:center;gap:.5rem;align-self:flex-start;margin-bottom:1.4rem;}
.verified-stamp-wrap{position:absolute;right:1.1rem;bottom:1.1rem;transform:rotate(-9deg);pointer-events:none;}
.verified-stamp-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--accent);color:var(--accent);opacity:.88;}
.verified-stamp-ring svg{flex:none;}
.verified-stamp-text{font-family:'Public Sans',sans-serif;font-weight:800;font-size:.5rem;line-height:1.2;letter-spacing:.06em;text-align:center;text-transform:uppercase;}
.face.back .tag{background:var(--accent-dark);}
.face .content{font-family:'Public Sans',system-ui,sans-serif;font-weight:500;font-size:1.3rem;line-height:1.45;flex:1;display:flex;align-items:center;overflow-wrap:anywhere;}
.face .idx{position:absolute;top:.9rem;right:1rem;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-soft);}
.face.back{transform:rotateY(180deg);}
.controls{display:flex;justify-content:center;align-items:center;gap:.6rem;flex-wrap:wrap;}
.btn{font-family:'Public Sans',sans-serif;font-weight:600;font-size:.95rem;border-radius:8px;border:1.5px solid var(--accent-dark);background:var(--accent);color:#fff;padding:.7em 1.3em;min-height:44px;cursor:pointer;}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:var(--card);color:var(--accent-dark);}
.btn.secondary:hover{background:var(--paper-alt);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.hint{color:var(--ink-soft);font-size:.9rem;text-align:center;}
#sr-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (prefers-reduced-motion: reduce){.card-inner{transition:none;}}
@media (max-width:500px){.face .content{font-size:1.2rem;}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="top">
<span class="eyebrow">Catalog Drawer</span>
<h1>AVCAER4051FC</h1>
</header>
<main id="main">
<div class="deck-meta"><span class="mono" id="progress"></span></div>
<div class="stage">
<button type="button" class="card-face" id="card-btn" aria-pressed="false">
<span class="card-inner" id="card-inner">
<span class="face front"><span class="idx mono" id="idx-front"></span><span class="face-badges"><span class="tag">Question</span></span><span class="content" id="front-text"></span></span>
<span class="face back" aria-hidden="true"><span class="idx mono" id="idx-back"></span><span class="face-badges"><span class="tag">Answer</span></span><span class="content" id="back-text"></span><span class="verified-stamp-wrap" aria-hidden="true"><span class="verified-stamp-ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="verified-stamp-text">Verified<br>Correct</span></span></span></span>
</span>
</button>
</div>
<div class="controls">
<button type="button" class="btn secondary" id="prev-btn">← Previous</button>
<button type="button" class="btn" id="flip-btn">Flip card</button>
<button type="button" class="btn secondary" id="next-btn">Next →</button>
<button type="button" class="btn secondary" id="shuffle-btn">Shuffle</button>
</div>
<p class="hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> on the focused card to flip it, and use the ←/→ arrow keys to move between cards.</p>
<div id="sr-status" aria-live="polite"></div>
</main>
<script>
(function(){
"use strict";
var cards = [{"front":"What is the primary engineering rationale for fillet-sealing a direct ground stud?","back":"To protect against galvanic and crevice corrosion while ensuring long-term electrical continuity."},{"front":"What type of barrier is created by applying sealant to a ground stud interface?","back":"A moisture barrier."},{"front":"How does corrosion at a ground stud interface affect an aircraft's electrical systems?","back":"It increases electrical resistance, leading to avionics malfunctions or system failures."},{"front":"What is a common short-term risk of failing to properly seal a ground stud base?","back":"Moisture intrusion and early-stage galvanic corrosion between dissimilar metals."},{"front":"Name a potential long-term consequence of structural degradation around a ground stud fastener.","back":"Costly structural repairs, system downtime, or grounding of the aircraft."},{"front":"What materials are typically used to manufacture a direct ground stud?","back":"Corrosion-resistant steel or aluminum alloy."},{"front":"Where does a direct ground stud head typically sit within the aircraft structure?","back":"Flush against the metal structure, usually on the interior or non-visible side."},{"front":"What condition must the stud head seating surface meet before sealing begins?","back":"It must be bare metal, free of paint, to ensure proper electrical bonding."},{"front":"Why is a self-locking nut required for ground stud assemblies?","back":"To prevent the nut from loosening due to operational vibration."},{"front":"What component serves as the electrical bonding point for wire terminals and bonding jumpers?","back":"The direct ground stud."},{"front":"Application: Verifying the self-locking nut is tightened to the engineering specification.","back":"Calibrated torque wrench."},{"front":"Which sealant specification is commonly used for general corrosion protection and fillet sealing?","back":"MIL-PRF-81733 (polysulfide-based)."},{"front":"When should the MIL-PRF-85420 sealant specification be used?","back":"In applications where there is a possibility of fuel or fluid exposure."},{"front":"What is the typical composition of aerospace-grade sealants?","back":"A two-component system consisting of a base and an accelerator."},{"front":"What is the consequence of an improper mixing ratio in a two-part sealant system?","back":"The sealant will fail to cure properly."},{"front":"Concept: Pot Life","back":"Definition: The available working time after sealant components are mixed before it becomes too viscous to apply."},{"front":"What is the typical range for sealant pot life depending on grade and temperature?","back":"30 minutes to 4 hours."},{"front":"Concept: Cure Time","back":"Definition: The period required for the sealant to reach full strength and chemical resistance."},{"front":"What is the typical cure time for aerospace sealants at room temperature?","back":"24 to 72 hours."},{"front":"How do high temperatures affect the pot life and cure time of a sealant?","back":"High temperatures accelerate the cure and shorten the pot life."},{"front":"Application: Smoothing and shaping the applied sealant bead into a concave profile.","back":"Rounded applicator tool or wooden spatula."},{"front":"What type of gloves must be worn when handling polysulfide sealants?","back":"Chemical-resistant nitrile gloves."},{"front":"Application: Degreasing the metal surface around the stud before application.","back":"Clean lint-free cloths and Methyl Ethyl Ketone (MEK) or approved equivalent."},{"front":"Why is it necessary to account for every tool and supply item during assembly?","back":"To prevent Foreign Object Damage (FOD)."},{"front":"Application: Defining the outer boundary of the fillet seal to ensure a neat bead.","back":"Precision masking tape."},{"front":"What must be checked regarding the sealant's shelf life before use?","back":"Verify the expiration date; expired sealant must never be used."},{"front":"Application: Combining the base and accelerator components of the sealant.","back":"Non-metallic mixing sticks and a clean container."},{"front":"What is the primary authority document to consult for sealant part numbers and fillet dimensions?","back":"The Engineering Order (EO) or assembly specification."},{"front":"How many stud threads must protrude beyond the self-locking nut after torque is applied?","back":"At least one full thread."},{"front":"What is the correct technique for solvent-wiping the surface area around a stud?","back":"Wipe in a single direction; do not scrub back and forth."},{"front":"Application: Applying precision masking tape without it lifting at the edges.","back":"Press tape edges firmly and avoid stretching the tape during application."},{"front":"How long should two-component sealants typically be stirred?","back":"3 to 5 minutes."},{"front":"In fillet sealing, where should the sealant be applied in relation to the aircraft structure?","back":"On both sides of the structure (nut side and stud head side) unless otherwise specified."},{"front":"What action is taken during tooling to prevent the sealant from sticking to the spatula?","back":"Dampen the tool tip with water or solvent per the manufacturer's instructions."},{"front":"When must masking tape be removed from the work area?","back":"While the sealant is still wet and before it begins to skin over."},{"front":"What is the correct technique for pulling masking tape away from the sealant edge?","back":"Pull back at a low angle of approximately $45^{\\circ}$ in a slow, steady motion."},{"front":"What is a 'holiday' in the context of sealant inspection?","back":"A gap or void in the sealant bead coverage."},{"front":"How should an assembly be handled during its 24- to 72-hour cure period?","back":"It must be left completely undisturbed with no force or torque applied to the stud."},{"front":"What is the temperature range for a typical room temperature cure?","back":"$70-77^{\\circ}F$ ($21-25^{\\circ}C$)."},{"front":"What visual characteristic defines a properly cured fillet seal?","back":"The fillet should be firm and resilient with no soft or tacky areas."},{"front":"What procedure is followed if a cured fillet seal is found to be non-conforming?","back":"Rework is required; fresh sealant should not be applied over cured material."},{"front":"Application: Removing deficient or non-conforming sealant during rework.","back":"Plastic scraper, wooden dowel, or approved sealant removal tool."},{"front":"What is the likely cause of poor sealant adhesion or peeling?","back":"A contaminated surface or a skipped solvent wipe."},{"front":"What causes ragged or uneven edges in a finished fillet seal?","back":"Removing the masking tape after the sealant has begun to skin or inconsistent tooling pressure."},{"front":"Application: Preventing sealant overflow and ensuring a clean boundary.","back":"Press masking tape edges firmly before applying a controlled amount of material."},{"front":"What is the consequence of air being trapped during the tooling process?","back":"The formation of voids or holidays in the sealant bead."},{"front":"What must be recorded on the Engineering Order regarding the sealant after application?","back":"The sealant batch or lot number."},{"front":"What are 'pre-saturated wipes' preferred for in surface preparation?","back":"To ensure consistent solvent application during degreasing."},{"front":"Why is it important to scrap the sides and bottom of the container during sealant mixing?","back":"To ensure the base and accelerator are thoroughly and uniformly combined."},{"front":"What is the required cross-sectional profile of a finished fillet seal?","back":"Smooth and concave."},{"front":"Under what condition can an accelerated cure at elevated temperatures be used?","back":"Only if performed according to the manufacturer's approved procedure."},{"front":"What must be done immediately before applying sealant to ensure a durable bond?","back":"Thorough surface cleaning and preparation."},{"front":"Application: Clearing the work area of tape backings, waste, and mixing containers.","back":"FOD prevention sweep/checklist."},{"front":"What should be done if a verbal instruction conflicts with the Engineering Order (EO)?","back":"Always follow the EO, as it is the authority document."},{"front":"Why is it forbidden to work from memory alone during aircraft assembly?","back":"Memory is unreliable; the EO must be used to confirm specific requirements like torque and dimensions."},{"front":"What is the primary function of the direct ground stud hardware?","back":"To provide a reliable electrical ground path through the aircraft structure."},{"front":"How does a technician verify that the solvent-wiped area is ready for sealant?","back":"The surface must be allowed to fully air-dry."},{"front":"What check must be performed on all PPE before handling hazardous solvents like MEK?","back":"Confirm that all PPE is available and undamaged."},{"front":"Application: Dispensing sealant directly onto an assembly to reduce mixing error.","back":"Pneumatic or manual caulking gun with a dual-cartridge and mixing nozzle."},{"front":"Why must the stud head be fully seated flush against the structure?","back":"To ensure maximum metal-to-metal contact and structural integrity."}];
var order = cards.map(function(_, i){ return i; });
var current = 0;
var cardBtn = document.getElementById("card-btn");
var frontText = document.getElementById("front-text");
var backText = document.getElementById("back-text");
var idxFront = document.getElementById("idx-front");
var idxBack = document.getElementById("idx-back");
var progressEl = document.getElementById("progress");
var prevBtn = document.getElementById("prev-btn");
var nextBtn = document.getElementById("next-btn");
var flipBtn = document.getElementById("flip-btn");
var shuffleBtn = document.getElementById("shuffle-btn");
var srStatus = document.getElementById("sr-status");
function shuffleArray(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function renderCard(announce){
  var c = cards[order[current]];
  frontText.textContent = c.front;
  backText.textContent = c.back;
  idxFront.textContent = String(current + 1).padStart(3, "0");
  idxBack.textContent = String(current + 1).padStart(3, "0");
  cardBtn.setAttribute("aria-pressed", "false");
  cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
  progressEl.textContent = "Card " + (current + 1) + " of " + cards.length;
  if (announce) srStatus.textContent = "Card " + (current + 1) + " of " + cards.length + ". Question: " + c.front;
  prevBtn.disabled = cards.length <= 1;
  nextBtn.disabled = cards.length <= 1;
}
function flipCard(){
  var pressed = cardBtn.getAttribute("aria-pressed") === "true";
  var c = cards[order[current]];
  if (pressed){
    cardBtn.setAttribute("aria-pressed", "false");
    cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
    srStatus.textContent = "Showing question: " + c.front;
  } else {
    cardBtn.setAttribute("aria-pressed", "true");
    cardBtn.setAttribute("aria-label", "Verified answer: " + c.back + ". Activate to show the question.");
    srStatus.textContent = "Showing verified answer: " + c.back;
  }
}
function goTo(delta){
  if (cards.length < 2) return;
  current = (current + delta + cards.length) % cards.length;
  renderCard(true);
}
cardBtn.addEventListener("click", flipCard);
flipBtn.addEventListener("click", function(){ cardBtn.focus(); flipCard(); });
prevBtn.addEventListener("click", function(){ goTo(-1); });
nextBtn.addEventListener("click", function(){ goTo(1); });
shuffleBtn.addEventListener("click", function(){ order = shuffleArray(order); current = 0; renderCard(false); srStatus.textContent = "Deck shuffled. Card 1 of " + cards.length; });
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft"){ e.preventDefault(); goTo(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); goTo(1); }
});
if (cards.length){ renderCard(true); } else { progressEl.textContent = "No cards found."; }
})();
</script>
</body>
</html>
